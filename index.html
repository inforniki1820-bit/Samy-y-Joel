<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Vestidos - Inicio</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Tienda de Vestidos</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="index.html">Inicio</a>
                   
                    </li>
                </ul>
            </div>
        </div>
    </nav><br><br>

    <!-- Carrusel -->
    <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
            <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
            <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
            <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./img/foto15.jpg" class="d-block w-100" alt="vestido 1">
            </div>
            <div class="carousel-item">
                <img src="./img/foto16.jpg" class="d-block w-100" alt="vestido 2">
            </div>
            <div class="carousel-item">
                <img src="./foto18.jpg" class="d-block w-100" alt="vestido 3">
            </div>
        </div>
        <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>
    </div>

    <!-- Cartas de productos -->
    <div class="container my-5">
        <div class="row">
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card h-100">
                    <img class="card-img-top" src="./img/foto4.jpg" alt="vestido en venta">
                    <div class="card-body">
                        <h4 class="card-title">Vestido 1</h4>
                        <h5>$24.99</h5>
                        <p class="card-text">Descripción del vestido 1.</p>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card h-100">
                    <img class="card-img-top" src="./img/foto1.jpg" alt="vestido en venta">
                    <div class="card-body">
                        <h4 class="card-title">Vestido 2</h4>
                        <h5>$24.99</h5>
                        <p class="card-text">Descripción del vestido 2.</p>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card h-100">
                    <img class="card-img-top" src="./img/foto8.jpg" alt="vestido en venta">
                    <div class="card-body">
                        <h4 class="card-title">Vestido 3</h4>
                        <h5>$24.99</h5>
                        <p class="card-text">Descripción del vestido 3.</p>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-5 bg-dark">
        <div class="container">
            <p class="m-0 text-center text-white">Por Nicol Vera &copy; Tienda de Vestidos 2024</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
